<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CV — Eng. Ebrahim Samir</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; color: #0b1324; background: #e5e9f0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html[lang="en"] body { font-family: 'Plus Jakarta Sans', 'Cairo', sans-serif; }
  .page { width: 210mm; height: 297mm; margin: 0 auto; background: #fff; display: grid; grid-template-columns: 70mm 1fr; overflow: hidden; }
  .side { background: linear-gradient(170deg, #0b1d33, #102a43 55%, #1e1b4b); color: #e2e8f0; padding: 13mm 8mm 10mm; display: flex; flex-direction: column; gap: 6.5mm; position: relative; }
  .side::before { content: ''; position: absolute; top: 0; inset-inline: 0; height: 2.2mm; background: linear-gradient(90deg, #14b8a6, #3b82f6, #a855f7); }
  .photo { width: 36mm; height: 36mm; border-radius: 50%; padding: 1.2mm; background: linear-gradient(135deg, #14b8a6, #6366f1, #a855f7); align-self: center; }
  .photo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 1mm solid #102a43; }
  .side h3 { font-size: 10pt; font-weight: 900; color: #5eead4; letter-spacing: .02em; margin-bottom: 2.4mm; padding-bottom: 1.6mm; border-bottom: 1px solid rgba(255,255,255,.14); }
  html[lang="en"] .side h3 { text-transform: uppercase; letter-spacing: .12em; font-size: 8.5pt; }
  .contact li, .langs li { list-style: none; font-size: 8.6pt; display: flex; gap: 2.4mm; align-items: center; margin-bottom: 2mm; word-break: break-all; }
  .contact li b { color: #fff; font-weight: 700; }
  .ico { width: 5.6mm; height: 5.6mm; border-radius: 1.6mm; background: rgba(255,255,255,.1); display: grid; place-items: center; flex-shrink: 0; font-size: 8pt; }
  .skills { display: flex; flex-wrap: wrap; gap: 1.4mm; }
  .skills span { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 7.4pt; font-weight: 700; padding: .9mm 2.2mm; border-radius: 1.6mm; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.14); color: #f1f5f9; }
  .bars div { margin-bottom: 2mm; font-size: 8.2pt; font-weight: 700; }
  .bars i { display: block; height: 1.4mm; border-radius: 1mm; background: rgba(255,255,255,.12); margin-top: .8mm; overflow: hidden; }
  .bars i::after { content: ''; display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, #14b8a6, #6366f1); border-radius: 1mm; }
  .qr { margin-top: auto; display: flex; gap: 3mm; align-items: center; font-size: 7.6pt; color: #94a3b8; }
  .qr img { width: 19mm; height: 19mm; border-radius: 2mm; background: #fff; padding: 1mm; }
  .qr b { color: #fff; display: block; font-size: 8.4pt; }

  .main { padding: 13mm 11mm 10mm; display: flex; flex-direction: column; gap: 5.2mm; }
  .head h1 { font-size: 25pt; font-weight: 900; line-height: 1.1; }
  .head h1 small { display: block; font-size: 10pt; font-weight: 800; letter-spacing: .3em; background: linear-gradient(90deg, #0d9488, #6366f1); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 1mm; }
  html[lang="ar"] .head h1 small { letter-spacing: .05em; }
  .head .role { font-size: 11.5pt; font-weight: 800; color: #2563eb; margin-top: 1.2mm; }
  .head p { font-size: 9.2pt; color: #334155; margin-top: 2mm; line-height: 1.75; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.4mm; }
  .stats div { border-radius: 2.6mm; padding: 2.4mm; background: linear-gradient(135deg, #ecfeff, #eef2ff); text-align: center; }
  .stats b { display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15pt; font-weight: 900; color: #0d9488; line-height: 1.1; }
  .stats span { font-size: 7.4pt; font-weight: 700; color: #475569; }
  .main h2 { font-size: 11pt; font-weight: 900; display: flex; align-items: center; gap: 2.4mm; margin-bottom: 2.2mm; }
  .main h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, #cbd5e1, transparent); }
  html[dir="rtl"] .main h2::after { background: linear-gradient(270deg, #cbd5e1, transparent); }
  .main h2 i { width: 2.2mm; height: 2.2mm; border-radius: 50%; background: linear-gradient(135deg, #14b8a6, #6366f1); }
  .job { margin-bottom: 2.6mm; }
  .job-top { display: flex; justify-content: space-between; gap: 3mm; align-items: baseline; }
  .job b { font-size: 9.8pt; }
  .job em { font-style: normal; font-size: 8pt; font-weight: 700; color: #64748b; white-space: nowrap; }
  .job .co { font-size: 8.6pt; font-weight: 700; color: #0d9488; }
  .job ul { margin-top: 1mm; padding-inline-start: 4mm; }
  .job li { font-size: 8.5pt; color: #334155; margin-bottom: .6mm; line-height: 1.6; }
  .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4mm; }
  .proj { border: 1px solid #e2e8f0; border-radius: 2.6mm; padding: 2.4mm 2.8mm; }
  .proj b { font-size: 8.9pt; display: flex; justify-content: space-between; gap: 2mm; }
  .proj b small { font-size: 6.8pt; font-weight: 800; color: #16a34a; background: #dcfce7; padding: .2mm 1.6mm; border-radius: 4mm; white-space: nowrap; align-self: center; }
  .proj p { font-size: 7.8pt; color: #475569; line-height: 1.5; margin-top: .4mm; }
  .proj span { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 6.8pt; font-weight: 700; color: #6366f1; }
  .edu { font-size: 9pt; }
  .edu b { font-size: 9.6pt; }
  .foot { margin-top: auto; font-size: 7.6pt; color: #94a3b8; display: flex; justify-content: space-between; border-top: 1px solid #e2e8f0; padding-top: 2mm; }
  /* Cairo is taller than Latin fonts — tighten the Arabic page so it fits one A4 sheet */
  html[lang="ar"] .side { gap: 4.6mm; padding-top: 11mm; }
  html[lang="ar"] .photo { width: 31mm; height: 31mm; }
  html[lang="ar"] .main { gap: 3.8mm; padding-top: 11mm; }
  html[lang="ar"] .head p, html[lang="ar"] .job li { line-height: 1.55; }
  html[lang="ar"] .contact li { margin-bottom: 1.4mm; }
  html[lang="ar"] .skills span { padding: .6mm 2mm; }
  html[lang="ar"] .bars div { margin-bottom: 1.4mm; }
  html[lang="ar"] .proj p { line-height: 1.4; }
  @media screen { .page { margin: 10mm auto; box-shadow: 0 20px 60px rgba(15,23,42,.25); } }
</style>
</head>
<body>
<div class="page" id="cv"></div>

  document.getElementById('cv').innerHTML = `

    <div><h3>${T.contact}</h3><ul class="contact">

</html>
